# QA screenshot of the members sheet (TR-56) on group-vegas: Matthew (Organizer, You), Blake and
# Willem, opened from the avatars in Plan's header.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: group-vegas
      READY_ID: plan-members
- tapOn:
    id: plan-members
- extendedWaitUntil:
    visible:
      id: plan-members-sheet
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: plan-members-sheet-user-blake
- takeScreenshot: group-members
