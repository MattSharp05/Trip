# QA screenshot of the Bucket List's Add a place sheet (TR-27) on the vegas-bucket scenario. Also
# proves a bottom sheet presents on device (TR-43).
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-bucket
      READY_ID: bucket-list
# Drag the Plan sheet up by its day header: a plain scroll would move the map.
- swipe:
    from:
      id: day-header
    direction: UP
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: bucket-add
    direction: DOWN
- tapOn:
    id: bucket-add
- extendedWaitUntil:
    visible:
      id: bucket-add-sheet
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-bucket-add
