# QA screenshot (TR-47): Plan, Fri Nov 13 with Sphere selected. The pins carry their stop number,
# the selected one its time and title; there are no straight lines between them.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-plan-day-2
      READY_ID: itinerary-list
# The Sphere row sits under the tab bar at the half-height sheet, and each row is one accessibility
# element ("3:00 PM, Sphere Experience, …"), so drag the sheet up by its day header and tap the row
# by testID (as plan-linking does). Tapping a row brings the sheet back down.
- swipe:
    from:
      id: day-header
    direction: UP
- waitForAnimationToEnd
- tapOn:
    id: itinerary-row-item-07
- assertVisible:
    id: itinerary-node-selected
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-plan-pins
