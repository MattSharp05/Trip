# QA screenshot of Suggest times for liked items (TR-64) on group-bucket-suggest: the sheet open on
# the group trip's liked items, most liked first (Golden Tiki, 2 likes, Sun 15 at 4:00 PM; Lotus of
# Siam, 1 like, Sat 14 at 3:45 PM), each with Skip and Accept, and Accept all.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: group-bucket-suggest
      READY_ID: suggest-accept-bucket-golden-tiki
- assertVisible: 'Sun 15, 4:00 PM · 2 likes'
- assertVisible:
    id: suggest-accept-all
