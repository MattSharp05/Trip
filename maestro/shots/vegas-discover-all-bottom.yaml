# TR-33 QA round 2: Discover's last section and its toast stay clear of the floating tab bar.
# Scrolls the vegas-discover-all scenario to the bottom (the Cape Town section must end above the
# tab bar, not under it), then saves an event and catches the toast (it floats above the tab bar).
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-discover-all
      READY_ID: discover-trip-trip-cape-town-events-empty
- swipe:
    from:
      id: discover-filters
    direction: UP
- swipe:
    from:
      id: discover-trip-trip-cape-town-events-empty
    direction: UP
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: discover-trip-trip-cape-town-events-empty
- takeScreenshot: vegas-discover-all-bottom
- scrollUntilVisible:
    element:
      id: 'discover-trip-trip-vegas-events-card-fx:o-bellagio-1112-add'
    direction: UP
- tapOn:
    id: 'discover-trip-trip-vegas-events-card-fx:o-bellagio-1112-add'
- extendedWaitUntil:
    visible:
      id: discover-toast
    timeout: 10000
- takeScreenshot: vegas-discover-toast
