# QA screenshot of Settings → Payment info (TR-55) in the group-vegas demo session: the Venmo,
# Cash App and Zelle fields with the "Friends on your trips see these" note.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: group-vegas
      READY_ID: itinerary-list
- runFlow:
    file: ../open-link.yaml
    env:
      APP_ID: com.mattsharp05.trip
      LINK: trip://settings/payment
- extendedWaitUntil:
    visible:
      id: payment-venmo
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: group-settings-payment
