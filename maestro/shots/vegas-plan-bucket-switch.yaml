# The Plan sheet's Itinerary / Bucket List switch from the accessibility tree (TR-42): Friday's
# itinerary, then the Bucket List segment, then back.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-plan-day-2
      READY_ID: itinerary-list
- tapOn: 'Bucket List.*'
- extendedWaitUntil:
    visible:
      id: bucket-list
    timeout: 10000
- assertVisible:
    text: 'Bucket List.*'
    selected: true
- takeScreenshot: vegas-plan-bucket-switch
- tapOn: 'Itinerary'
- extendedWaitUntil:
    visible:
      id: itinerary-list
    timeout: 10000
