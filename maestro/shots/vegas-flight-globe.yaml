# QA screenshot of the flight globe (TR-23): vegas-flight-day, then tap "Arrive in Las Vegas" so the
# map area shows TPA → LAS on the globe with the AA 2410 card at the top of the sheet.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-flight-day
      READY_ID: itinerary-list
- tapOn:
    id: itinerary-row-item-01
- extendedWaitUntil:
    visible:
      id: flight-card
    timeout: 15000
# Let the globe's imagery load before the picture.
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: vegas-flight-globe
