# QA screenshot of Edit mode on the itinerary (TR-24 QA round 2): tap Edit, drag Bellagio Fountains
# up by its handle, and it becomes the day's first stop at 10:00 AM. Proves the handle's drag works
# inside the Plan sheet on device (the touch-and-hold drag never lifted there).
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-plan-day-2
      READY_ID: itinerary-list
- tapOn:
    id: day-header-reorder
- extendedWaitUntil:
    visible: Done reordering
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
# The handles are hidden from accessibility (VoiceOver reorders with the row's Move earlier / Move
# later actions), so XCTest can't find itinerary-handle-item-06 by testID (TR-40). Drag from where
# Bellagio Fountains' handle sits on the iPhone simulator (right edge, second row of the
# half-height sheet) up past the first row.
- swipe:
    start: '92%,83%'
    end: '92%,68%'
    duration: 1500
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: '10:00.AM, Bellagio Fountains.*'
    timeout: 10000
- takeScreenshot: vegas-plan-reorder
