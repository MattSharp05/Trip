# QA screenshot of naming a dropped pin (TR-27): touch and hold the map with the Bucket List open.
# Proves the map's long press reaches the app and a sheet mounted closed still presents (TR-27 QA
# round 2: every sheet that started closed never showed on device).
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-bucket
      READY_ID: bucket-list
# A point on open map, not the map's centre: the map fills the screen behind the sheet (TR-46),
# so its centre lands on the Bucket List pins, and a long press on a pin drops nothing.
- longPressOn:
    point: '25%,30%'
- extendedWaitUntil:
    visible:
      id: bucket-add-sheet
    timeout: 15000
- assertVisible: Name this place
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-bucket-drop-pin
