# QA screenshot of Organize's + (TR-25): the "Add to your wallet" sheet (PDF, screenshot, passport
# or visa). Shares the Sheet fix from TR-27 QA round 2: a sheet mounted closed never presented on
# device, so the + did nothing.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-wallet
      READY_ID: wallet-list
- tapOn:
    id: organize-add
- extendedWaitUntil:
    visible:
      id: add-booking-sheet
    timeout: 15000
- assertVisible: Add to your wallet
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-wallet-add
