# QA screenshots of Smart Add (TR-29): vegas-bucket, then Smart Add on Golden Tiki. The Plan sheet
# switches to Sun Nov 15 with Golden Tiki selected between AREA15 and UFC 310, and the toast says
# where it went, with Undo.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-bucket
      READY_ID: bucket-list
- tapOn:
    id: smart-add-bucket-golden-tiki
- extendedWaitUntil:
    visible: 'Added to Sun 15, 4:00.PM.*'
    timeout: 10000
- takeScreenshot: vegas-bucket-smart-add
# Undo isn't driven here: the toast goes after 4 s, which a slow simulator can miss, and the Plan
# sheet's Itinerary / Bucket List segments aren't in the iOS accessibility hierarchy, so the flow
# can't switch back (TR-41). Jest covers Undo (__tests__/smart-add.test.tsx, plan-all.test.tsx).
