# QA screenshot of a traveller's balance (TR-65) on group-balances: Willem owes you $57.60, then the
# Uber (your share) and the euro dinner (Willem's share, with its dollar amount), newest first.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: group-balances
      READY_ID: balances
- tapOn:
    id: balance-row-user-willem
- extendedWaitUntil:
    visible:
      id: person-history
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: Willem owes you
- takeScreenshot: group-balance-person
