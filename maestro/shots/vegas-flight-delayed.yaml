# QA screenshot of live flight status (TR-26): vegas-flight-delayed, then tap "Arrive in Las Vegas"
# so the AA 2410 card shows "Delayed 25 min", then open its details (gate E79, "Updated").
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-flight-delayed
      READY_ID: itinerary-list
- tapOn:
    id: itinerary-row-item-01
- extendedWaitUntil:
    visible:
      id: flight-status-pill
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: vegas-flight-delayed-plan
- tapOn:
    id: flight-card
- extendedWaitUntil:
    visible:
      id: flight-fact-updated-gate
    timeout: 15000
- takeScreenshot: vegas-flight-delayed-details
