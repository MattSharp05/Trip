# QA screenshot of the invite preview (TR-57) on group-invite: Matthew's Las Vegas invite opened by
# a friend, "Join Las Vegas, Nov 12 – 16 · with Matthew and 2 others"; then Join opens Plan.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: group-invite
      READY_ID: invite-preview-card
- tapOn:
    id: invite-preview-join
- extendedWaitUntil:
    visible:
      id: plan-members
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: group-invite-joined
