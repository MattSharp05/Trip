# QA screenshot of the trip switcher sheet (TR-33) from Plan's trip title. Also proves a bottom
# sheet presents on device (TR-43).
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-plan-day-2
      READY_ID: plan-trip-title
- tapOn:
    id: plan-trip-title
- extendedWaitUntil:
    visible:
      id: trip-switcher
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-trip-switcher
