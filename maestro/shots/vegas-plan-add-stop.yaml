# QA screenshot of the day header's + (TR-24): the "Add a stop" sheet. With the swipe's Edit and Move
# and the time wheel, it shares the Sheet fix from TR-27 QA round 2 (a sheet mounted closed never
# presented on device).
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-plan-day-2
      READY_ID: itinerary-list
- tapOn:
    id: day-header-add
- extendedWaitUntil:
    visible:
      id: itinerary-edit-sheet
    timeout: 15000
- assertVisible: Add a stop
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-plan-add-stop
