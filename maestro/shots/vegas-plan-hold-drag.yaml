# QA screenshot of touch and hold, then drag (TR-24 QA round 4, react-native-sortables, ADR 0024):
# hold Bellagio Fountains, drag it to the top of the day and let go → it's the first stop at
# 10:00 AM. Maestro's iOS swipe moves from the first instant (it can't hold first), so this swipe is
# very slow: in the first 350 ms the finger moves well under the 10 pt the hold allows, the row
# lifts, and the rest of the swipe drags it. A failed lift leaves Fountains second and the wait fails.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-plan-day-2
      READY_ID: itinerary-list
- extendedWaitUntil:
    visible:
      id: itinerary-row-item-06
    timeout: 10000
# A short swipe, not `direction: UP`: that one runs to the top of the screen (636 pt in 20 s, about
# 11 pt in the first 350 ms), past the hold's 10 pt, so the sheet's pan took it (TR-40). 13% of the
# screen in 20 s moves about 2 pt during the hold; Fountains' row is at 83% at the half-height
# sheet, and 70% is above Brunch's.
- swipe:
    start: '50%,83%'
    end: '50%,70%'
    duration: 20000
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: '10:00.AM, Bellagio Fountains.*'
    timeout: 10000
- takeScreenshot: vegas-plan-hold-drag
