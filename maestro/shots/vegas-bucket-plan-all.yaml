# QA screenshots of Plan my bucket list (TR-32): vegas-bucket, then the button at the top of the
# list. All five saved items go into the trip; the Plan sheet opens Thu Nov 12 (Pinball Hall of Fame
# and Fremont Street Experience added) and the toast says how many were placed, with Undo.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-bucket
      READY_ID: bucket-list
- tapOn:
    id: bucket-plan-all
- extendedWaitUntil:
    visible: 'Placed 5 items across your trip.*'
    timeout: 10000
- takeScreenshot: vegas-bucket-plan-all
- tapOn: 'Undo'
- tapOn: 'Bucket List.*'
- extendedWaitUntil:
    visible:
      id: bucket-plan-all
    timeout: 10000
