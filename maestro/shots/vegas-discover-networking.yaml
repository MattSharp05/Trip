# QA screenshots for TR-34 on the vegas-discover scenario: the Networking chip's sample events,
# then (All again, scrolled down) the "Saved from TikTok & Reels" row.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-discover
      READY_ID: discover-events
- tapOn:
    id: discover-filter-networking
- extendedWaitUntil:
    visible:
      id: discover-events-card-sample:founders-breakfast-1112-tag
    timeout: 10000
- takeScreenshot: vegas-discover-networking
- tapOn:
    id: discover-filter-all
- scrollUntilVisible:
    element:
      id: discover-reels
    direction: DOWN
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-discover-reels
