# QA screenshot (TR-46 QA round 2): drag the Plan sheet all the way down; the map takes the screen
# with only the grabber and the day header left above the tab bar.
appId: com.mattsharp05.trip
tags:
  - shots
---
- runFlow:
    file: ../scenario.yaml
    env:
      SCENARIO: vegas-plan-day-2
      READY_ID: itinerary-list
- swipe:
    from:
      id: day-header
    direction: DOWN
    duration: 600
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: vegas-plan-full-map
