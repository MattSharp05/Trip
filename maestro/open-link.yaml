# Opens LINK and accepts iOS's "Open in …?" confirmation (custom-scheme links on the simulator;
# Expo Go links too). Used by the other flows through runFlow; not run on its own. Retried because
# a slow simulator can time out opening the link while that confirmation is up.
appId: ${APP_ID}
env:
  APP_ID: com.mattsharp05.trip
---
- retry:
    maxRetries: 2
    commands:
      # A confirmation left over from a timed-out attempt.
      - runFlow:
          when:
            visible: 'Open in .*'
          commands:
            - tapOn: 'Open'
      - openLink: ${LINK}
      - extendedWaitUntil:
          visible: 'Open in .*'
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: 'Open in .*'
          commands:
            - tapOn: 'Open'
