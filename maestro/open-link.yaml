# Opens LINK and accepts iOS's "Open in …?" confirmation (custom-scheme links on the simulator;
# Expo Go links too). Used by the other flows through runFlow; not run on its own. Retried because
# a slow simulator can time out opening the link while that confirmation is up. Callers pass APP_ID
# and LINK; no defaults here, since a subflow's env replaces the caller's (TR-41).
# After accepting, the link is opened again: on a slow simulator the first request has often
# timed out by the time "Open" is tapped, so the app never gets it (TR-40). Accepting is
# remembered until the app is reinstalled, so the second open goes straight to the app.
appId: ${APP_ID}
---
- retry:
    maxRetries: 2
    commands:
      # A confirmation left over from a timed-out attempt.
      - runFlow:
          when:
            visible: 'Open in .*'
          commands:
            - tapOn: 'Open'
      - openLink: ${LINK}
      - extendedWaitUntil:
          visible: 'Open in .*'
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: 'Open in .*'
          commands:
            - tapOn: 'Open'
            - openLink: ${LINK}
