# Opens one scenario by name, waits for its screen and takes a screenshot named after it: the QA
# picture for a ticket. The e2e workflow runs it through the files in maestro/shots/ (one per
# scenario). By hand: maestro test -e SCENARIO=vegas-wallet -e READY_ID=<testID> maestro/scenario.yaml
# Pass SCENARIO and READY_ID (a testID that is on screen once the scenario has loaded) with runFlow's
# env or `-e`. No defaults for them here: a subflow's own env is applied after the caller's, so a
# default would replace what every caller passes (TR-41: every shot opened vegas-plan-day-2).
appId: ${APP_ID}
env:
  APP_ID: com.mattsharp05.trip
---
- launchApp
- runFlow:
    file: open-link.yaml
    env:
      APP_ID: ${APP_ID}
      LINK: trip://scenario/${SCENARIO}
- extendedWaitUntil:
    visible:
      id: ${READY_ID}
    timeout: 30000
# Let maps and photos settle before the picture.
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${SCENARIO}
