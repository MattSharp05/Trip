# TR-17: the Plan screen's itinerary and map, linked both ways, on vegas-plan-day-2.
# Runs on every e2e run (TR-8) on the EAS simulator build. In Expo Go by hand:
#   maestro test -e APP_ID=host.exp.Exponent \
#     -e LINK='exp://u.expo.dev/0458c1dd-61a0-47f7-ac52-c648b4458fea/--/scenario/vegas-plan-day-2?runtime-version=exposdk:57.0.0&channel-name=main' \
#     maestro/plan-linking.yaml
appId: ${APP_ID}
env:
  APP_ID: com.mattsharp05.trip
  LINK: trip://scenario/vegas-plan-day-2
tags:
  - plan
  - checkpoint
---
- launchApp
- runFlow:
    file: open-link.yaml
    env:
      APP_ID: ${APP_ID}
      LINK: ${LINK}
- extendedWaitUntil:
    visible:
      id: itinerary-list
    timeout: 30000

# Friday's four stops, in order.
- assertVisible: '10:00 AM'
- assertVisible: 'Brunch at Mon Ami Gabi'
- assertVisible: 'Bellagio Fountains'
- assertVisible: 'Sphere Experience'
- assertVisible: 'Dinner at Carbone'
- takeScreenshot: plan-linking-1-day

# Row → map: the Sphere row is selected and its pin shows its label.
- tapOn:
    id: itinerary-row-item-07
- assertVisible:
    id: itinerary-row-item-07
    selected: true
- assertVisible:
    id: itinerary-node-selected
- waitForAnimationToEnd
- takeScreenshot: plan-linking-2-row-selects-pin

# Map → row: the Carbone pin selects and reveals its row.
- tapOn:
    id: pin-place-carbone
- assertVisible:
    id: itinerary-row-item-08
    selected: true
- waitForAnimationToEnd
- takeScreenshot: plan-linking-3-pin-selects-row

# A new day clears the selection and re-frames the map.
- tapOn:
    id: pill-2026-11-14
- assertVisible: 'Gondola at The Venetian'
- assertNotVisible:
    id: itinerary-node-selected
- waitForAnimationToEnd
- takeScreenshot: plan-linking-4-new-day
