name: CI

# Two levels (TDD → CI pipeline, ADR 0005):
# - PR gate: lint + typecheck + expo-doctor, and Jest, in parallel; skipped for docs-only PRs.
# - Push to main: the same checks on the full suite, then (when supabase/** changed) the Supabase
#   migrations + RLS test, then an EAS Update to branch `main`, which the `main` channel serves to
#   Expo Go (the QA link in CLAUDE.md).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # PRs cancel superseded runs; every push to main runs to completion so each merge publishes.
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name == 'push' || steps.filter.outputs.code == 'true' }}
      supabase: ${{ steps.filter.outputs.supabase == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            supabase:
              - 'supabase/**'

  check:
    name: Lint, typecheck, expo-doctor
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx --yes expo-doctor

  test:
    name: Jest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test -- --ci

  supabase:
    name: Supabase migrations + RLS test
    needs: [changes, check, test]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.changes.outputs.supabase == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supabase-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wghftsubdrkxfzysovou
    steps:
      - name: Require the SUPABASE_ACCESS_TOKEN secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN missing::Add the SUPABASE_ACCESS_TOKEN repository secret (GitHub → Settings → Secrets and variables → Actions) with a personal access token from supabase.com/dashboard/account/tokens."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply migrations and auth config
        run: node scripts/supabase-apply.mjs
      - name: RLS test (two throwaway users)
        run: node scripts/supabase-rls-test.mjs

  update:
    name: EAS Update (main)
    # After the database migrates, so a published update never runs against an older schema.
    needs: [check, test, supabase]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.check.result == 'success' && needs.test.result == 'success' &&
      needs.supabase.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the EXPO_TOKEN secret
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=EXPO_TOKEN missing::Add the EXPO_TOKEN repository secret (GitHub → Settings → Secrets and variables → Actions) with an Expo access token from expo.dev → Account settings → Access tokens."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci --no-audit --no-fund
      - name: Publish to branch main
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)"
          eas update --branch main --platform ios --environment preview \
            --message "$subject" --non-interactive
